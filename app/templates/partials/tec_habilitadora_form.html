        <div class="card shadow-sm categorization-card border-0 mt-4" id="techabilitadoraForm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center"
                 id="techabilitadoraHeader" data-bs-toggle="collapse" data-bs-target="#techabilitadoraContent"
                 aria-expanded="true" aria-controls="techabilitadoraContent" role="button">
                <h5 class="mb-0 fw-bold">
                    <i class="fas fa-cogs me-2 text-primary"></i>Tecnologia Habilitadora
                </h5>
                <button class="btn btn-link p-0 border-0 techabilitadora-collapse-icon">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>

            <div id="techabilitadoraContent" class="collapse show">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <div class="form-floating">
                                <select class="form-select shadow-sm" id="tecnologia_habilitadora" name="tecnologia_habilitadora">
                                    <option value="">Selecione...</option>
                                    {% for option in categories_lists.get('tecnologias_habilitadoras', []) %}
                                        {% if option %}
                                        <option value="{{ option }}" {% if existing and existing.tecnologia_habilitadora == option %}selected{% endif %}>{{ option }}</option>
                                        {% endif %}
                                    {% endfor %}
                                </select>
                                <label for="tecnologia_habilitadora">Tecnologia Habilitadora</label>
                            </div>
                        </div>
                        <div class="col-md-12 mt-3 d-flex justify-content-end">
                            <button type="button" id="saveTecHabilitadoraBtn" class="btn btn-success rounded-pill" style="width: 100%;">
                                <i class="fas fa-save me-1"></i> SALVAR
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
